
name: Deploy TRACEPOINT Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Digital_Investigation_System/my-react-app/DigitalInvestigationAPI/Frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: Digital_Investigation_System/my-react-app/DigitalInvestigationAPI/Frontend
        run: npm ci

      - name: Build React application
        working-directory: Digital_Investigation_System/my-react-app/DigitalInvestigationAPI/Frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-pages-artifact@v3
        with:
          path: Digital_Investigation_System/my-react-app/DigitalInvestigationAPI/Frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
